<filter id="ph"><feGaussianBlur stdDeviation=".6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="880" height="300" rx="14" fill="#0A0F0A"/>
<rect width="880" height="300" rx="14" fill="url(#glow)"/>
<g filter="url(#ph)"><text x="40" y="78" fill="#FFB000" font-size="16" opacity="0">ABSOLUTE-CTRL BIOS v2.0<tspan fill="#1F7A3A">   (C) 2026  PHOSPHOR SYSTEMS</tspan><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.05s" fill="freeze"/></text><text x="40" y="104" fill="#33FF66" font-size="16" opacity="0">Memory test ................ <tspan fill="#FFB000">640K OK</tspan><animate attributeName="opacity" from="0" to="1" begin="0.75s" dur="0.05s" fill="freeze"/></text><text x="40" y="130" fill="#33FF66" font-size="16" opacity="0">Detecting graphics adapter . <tspan fill="#FFB000">OpenGL / Vulkan OK</tspan><animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.05s" fill="freeze"/></text><text x="40" y="156" fill="#33FF66" font-size="16" opacity="0">Probing CPU features ....... <tspan fill="#FFB000">SIMD, caches, pointers OK</tspan><animate attributeName="opacity" from="0" to="1" begin="1.65s" dur="0.05s" fill="freeze"/></text><text x="40" y="182" fill="#33FF66" font-size="16" opacity="0">Mounting z/OS datasets ..... <tspan fill="#FFB000">READY</tspan><animate attributeName="opacity" from="0" to="1" begin="2.1s" dur="0.05s" fill="freeze"/></text><text x="40" y="208" fill="#33FF66" font-size="16" opacity="0">Loading C runtime .......... <tspan fill="#FFB000">GCC UCRT64 OK</tspan><animate attributeName="opacity" from="0" to="1" begin="2.5500000000000003s" dur="0.05s" fill="freeze"/></text><text x="40" y="248" fill="#33FF66" font-size="16" opacity="0">C:\&gt; boot profile.sys<animate attributeName="opacity" from="0" to="1" begin="3.0000000000000004s" dur="0.05s" fill="freeze"/></text><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.0000000000000004s" dur="0.05s" fill="freeze"/><rect x="252" y="234" width="10" height="17" fill="#33FF66" opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1s" begin="3.0000000000000004s" repeatCount="indefinite"/></rect></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.4000000000000004s" dur="0.05s" fill="freeze"/>
<text x="840" y="118" text-anchor="end" fill="#FFB000" font-size="44" font-weight="700" letter-spacing="2">ABSOLUTE</text>
<text x="840" y="164" text-anchor="end" fill="#FFB000" font-size="44" font-weight="700" letter-spacing="2">-CTRL</text>
<text x="840" y="196" text-anchor="end" fill="#1F7A3A" font-size="14">systems + graphics programmer</text></g></g>
<rect width="880" height="300" rx="14" fill="url(#scan)"/>
