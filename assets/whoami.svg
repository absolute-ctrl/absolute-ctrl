<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230" font-family="'IBM Plex Mono','Cascadia Mono',Consolas,'Courier New',monospace">
<defs>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" opacity=".28"/></pattern>
<radialGradient id="glow" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#143a1c" stop-opacity=".55"/><stop offset="1" stop-color="#0A0F0A" stop-opacity="0"/></radialGradient>
<filter id="ph"><feGaussianBlur stdDeviation=".6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="880" height="230" rx="14" fill="#0A0F0A"/>
<rect width="880" height="230" rx="14" fill="url(#glow)"/>
<g filter="url(#ph)"><text x="28" y="34" fill="#FFB000" font-size="15" font-weight="700">&gt; WHOAMI</text><line x1="28" y1="46" x2="852" y2="46" stroke="#1F7A3A" stroke-dasharray="4 4"/><text x="28" y="80" fill="#1F7A3A" font-size="15">C:\&gt; <tspan fill="#33FF66">whoami</tspan></text><text x="28" y="112" fill="#FFB000" font-size="16">Systems programmer. Graphics tinkerer.</text><text x="28" y="138" fill="#33FF66" font-size="16">I write C close to the metal and COBOL close to the mainframe.</text><text x="28" y="164" fill="#33FF66" font-size="16">I care about where every byte lives, how every pixel gets drawn,</text><text x="28" y="190" fill="#33FF66" font-size="16">and what the OS is doing behind my back.</text></g>
<rect width="880" height="230" rx="14" fill="url(#scan)"/>
<rect x="1.5" y="1.5" width="877" height="227" rx="13" fill="none" stroke="#1F7A3A" stroke-width="3"/>
</svg>