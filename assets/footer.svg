<svg xmlns="http://www.w3.org/2000/svg" width="880" height="104" viewBox="0 0 880 104" font-family="'IBM Plex Mono','Cascadia Mono',Consolas,'Courier New',monospace">
<defs>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" opacity=".28"/></pattern>
<radialGradient id="glow" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#143a1c" stop-opacity=".55"/><stop offset="1" stop-color="#0A0F0A" stop-opacity="0"/></radialGradient>
<filter id="ph"><feGaussianBlur stdDeviation=".6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="880" height="104" rx="14" fill="#0A0F0A"/>
<rect width="880" height="104" rx="14" fill="url(#glow)"/>
<g filter="url(#ph)"><text x="28" y="44" fill="#33FF66" font-size="18">READY.</text><text x="28" y="74" fill="#FFB000" font-size="16">PRESS ANY KEY TO CONTINUE</text><rect x="278" y="60" width="10" height="17" fill="#33FF66" opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1s" begin="0s" repeatCount="indefinite"/></rect></g>
<rect width="880" height="104" rx="14" fill="url(#scan)"/>
<rect x="1.5" y="1.5" width="877" height="101" rx="13" fill="none" stroke="#1F7A3A" stroke-width="3"/>
</svg>