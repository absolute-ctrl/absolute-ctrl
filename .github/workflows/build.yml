name: build-snapshot

# Rebuilds profile.svg (the static snapshot/fallback) whenever the config or renderer changes.
# The live, per-access telemetry is served by api/profile.py on Vercel, not by this workflow.
on:
  push:
    paths: ["profile.json", "profilekit/**", "scripts/**"]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build profile.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build.py
      - name: Commit if changed
        run: |
          git config user.name "telemetry-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile.svg
          git diff --cached --quiet || (git commit -m "Rebuild profile snapshot" && git push)
